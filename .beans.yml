beans:

    path: .beans
    prefix: beans-
    id_length: 4
    default_status: todo
    default_type: task

launchers:
  # Composed from scripts/bean-launch [--worktree] [--tmux|--kitty] <claude|opencode|crush>
  - name: worktree-tmux+claude
    multiple: true
    background: true
    description: "Create git worktree and open Claude Code in a new tmux window"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" --worktree --tmux claude'
  - name: worktree-tmux+opencode
    multiple: true
    background: true
    description: "Create git worktree and open OpenCode in a new tmux window"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" --worktree --tmux opencode'
  - name: worktree-tmux+crush
    multiple: true
    background: true
    description: "Create git worktree and open Crush in a new tmux window"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" --worktree --tmux crush'
  - name: tmux+claude
    background: true
    description: "Open task in Claude Code in a new tmux window"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" --tmux claude'
  - name: tmux+opencode
    background: true
    description: "Open task in OpenCode in a new tmux window"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" --tmux opencode'
  - name: worktree-kitty+opencode
    multiple: true
    background: true
    description: "Create git worktree and open OpenCode in a new kitty window"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" --worktree --kitty opencode'
  - name: tmux
    exec: ./scripts/tmux-session-run
    description: "Open task in tmux"
  - name: claude
    description: "Open task in Claude Code"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" claude'
  - name: opencode
    description: "Open task in OpenCode"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" opencode'
  - name: crush
    description: "Open task in Crush"
    exec: '"${BEANS_ROOT:-.}/scripts/bean-launch" crush'
