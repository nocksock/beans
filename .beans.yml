beans:

    path: .beans
    prefix: beans-
    id_length: 4
    default_status: todo
    default_type: task

# Launches are composed from the builtins (`beans launch --list`), one line per
# choice of host (tmux, kitty, this terminal) and place (the dev worktree or the
# bean's own worktree). `prompt` and `worktree` are overridden for this hub:
#   - worktrees live next to dev, on a branch off dev; branches that predate the
#     hub are hidden from their .beans/ and .beans.yml via sparse-checkout, so
#     the hub's tasks stay the ones in use
#   - the prompt ends with the hub's dev-merge cleanup steps
launchers:
  - name: worktree-tmux+claude
    multiple: true
    background: true
    description: "Create git worktree and open Claude Code in a new tmux window"
    exec: |
      #!/bin/sh
      set -eu
      dir=$("$BEANS_BIN" launch worktree)
      "$BEANS_BIN" launch tmux-window -- --cwd "$dir" -- \
        "$BEANS_BIN" launch agent -- claude --tmux --worktree "$dir"
  - name: worktree-tmux+opencode
    multiple: true
    background: true
    description: "Create git worktree and open OpenCode in a new tmux window"
    exec: |
      #!/bin/sh
      set -eu
      dir=$("$BEANS_BIN" launch worktree)
      "$BEANS_BIN" launch tmux-window -- --cwd "$dir" -- \
        "$BEANS_BIN" launch agent -- opencode --tmux --worktree "$dir"
  - name: worktree-tmux+crush
    multiple: true
    background: true
    description: "Create git worktree and open Crush in a new tmux window"
    exec: |
      #!/bin/sh
      set -eu
      dir=$("$BEANS_BIN" launch worktree)
      "$BEANS_BIN" launch tmux-window -- --cwd "$dir" -- \
        "$BEANS_BIN" launch agent -- crush --tmux --worktree "$dir"
  - name: tmux+claude
    background: true
    description: "Open task in Claude Code in a new tmux window"
    exec: |
      #!/bin/sh
      set -eu
      "$BEANS_BIN" launch tmux-window -- --cwd "$BEANS_ROOT/dev" -- \
        "$BEANS_BIN" launch agent -- claude --tmux
  - name: tmux+opencode
    background: true
    description: "Open task in OpenCode in a new tmux window"
    exec: |
      #!/bin/sh
      set -eu
      "$BEANS_BIN" launch tmux-window -- --cwd "$BEANS_ROOT/dev" -- \
        "$BEANS_BIN" launch agent -- opencode --tmux
  - name: worktree-kitty+opencode
    multiple: true
    background: true
    description: "Create git worktree and open OpenCode in a new kitty window"
    exec: |
      #!/bin/sh
      set -eu
      dir=$("$BEANS_BIN" launch worktree)
      "$BEANS_BIN" launch kitty-window -- --cwd "$dir" -- \
        "$BEANS_BIN" launch agent -- opencode --worktree "$dir"
  - name: tmux
    description: "Open task in tmux"
    exec: |
      #!/bin/sh
      set -eu
      exec "$BEANS_BIN" launch tmux-session -- --cwd "$BEANS_ROOT/dev"
  - name: claude
    description: "Open task in Claude Code"
    exec: |
      #!/bin/sh
      set -eu
      cd "$BEANS_ROOT/dev"
      exec "$BEANS_BIN" launch agent -- claude
  - name: opencode
    description: "Open task in OpenCode"
    exec: |
      #!/bin/sh
      set -eu
      cd "$BEANS_ROOT/dev"
      exec "$BEANS_BIN" launch agent -- opencode
  - name: crush
    description: "Open task in Crush"
    exec: |
      #!/bin/sh
      set -eu
      cd "$BEANS_ROOT/dev"
      exec "$BEANS_BIN" launch agent -- crush

  # Internal pieces of the launches above, also runnable on their own.
  - name: prompt
    description: "Print the agent prompt (hub flavour: adds the dev-merge cleanup steps)"
    exec: |
      #!/bin/sh
      set -eu
      "$BEANS_BIN" launch parent.prompt -- "$@"

      worktree=""
      tmux_window=false
      while [ $# -gt 0 ]; do
          case $1 in
              --tmux) tmux_window=true; shift ;;
              --worktree) shift; worktree=${1:-}; shift || true ;;
              --worktree=*) worktree=${1#--worktree=}; shift ;;
              *) shift ;;
          esac
      done
      [ -n "$worktree" ] || exit 0

      # Unquoted heredoc: hub paths are baked in, \$TMUX_PANE must resolve in
      # the agent's window
      cat <<EOF

      ## Cleanup when done

      This bean runs in the worktree $worktree on branch task/$BEANS_ID. Clean up only after the user has explicitly declared the work done. Never on your own initiative, and never because the bean is marked completed.

      Once the user has declared the work done, first bring the branch up to date with dev:
      - Commit any remaining work on task/$BEANS_ID.
      - Merge dev into the task branch: \`git -C "$worktree" merge dev\`. If it conflicts, resolve the conflicts here in the worktree, run the tests, and commit the merge. If you cannot resolve a conflict with confidence, stop and ask the user.

      Only then ask them with your question tool, offering exactly these two options:
      - "Merge into dev, cleanup": merge the task branch into dev with \`git -C "$BEANS_ROOT/dev" merge --no-ff task/$BEANS_ID\`. Since dev was merged in first, this must apply cleanly; if it conflicts anyway or the dev worktree has uncommitted changes, stop and tell the user. Then run the steps below.
      - "Merged, cleanup": the user has merged it already. Run the steps below.

      1. Confirm the merge: \`git -C "$BEANS_ROOT" merge-base --is-ancestor task/$BEANS_ID dev\` must succeed. If it fails, stop and tell the user.
      2. Check the related beans (parent, children, blocking and blocked-by; see \`beans show $BEANS_ID\`). If decisions or outcomes of this work affect any of them, update them with \`beans update\`, e.g. their body, status or blocking links, and tell the user what you changed.
      3. Mark the bean completed and commit it in the hub together with any related bean updates: \`beans update $BEANS_ID --status completed && git -C "$BEANS_ROOT" add .beans && git -C "$BEANS_ROOT" commit -m "chore: complete $BEANS_ID"\`
      4. Remove the worktree: \`git -C "$BEANS_ROOT" worktree remove "$worktree"\`. Do not pass --force; if it refuses because of uncommitted changes, stop and tell the user.
      5. Delete the branch from the dev worktree, so -d checks it against dev: \`git -C "$BEANS_ROOT/dev" branch -d task/$BEANS_ID\`
      EOF

      if $tmux_window; then
          cat <<'EOF'
      6. Close this tmux window as the very last step, since it ends this session: `tmux kill-window -t "$TMUX_PANE"`
      EOF
      fi
  - name: worktree
    description: "Create the bean's worktree next to dev and print its path"
    exec: |
      #!/bin/sh
      set -eu
      # stdout is the path only, so the nested call's output stays parseable
      dir=$("$BEANS_BIN" launch parent.worktree -- --base dev --dir "$BEANS_ROOT/$BEANS_ID")

      # Branches created before the hub still carry .beans/ and .beans.yml;
      # hide them so the hub's tasks stay the ones in use
      if git -C "$dir" cat-file -e "HEAD:.beans.yml" 2>/dev/null; then
          git -C "$dir" sparse-checkout set --no-cone '/*' '!/.beans/' '!/.beans.yml' >&2
      fi

      printf '%s\n' "$dir"
