beans:

    path: .beans
    prefix: beans-
    id_length: 4
    default_status: todo
    default_type: task

session:
  check: ./scripts/tmux-session-check
  attach: ./scripts/tmux-session-attach
  launch: ./scripts/tmux-session-run

launchers:
  - name: opencode
    exec: opencode --prompt "Work on task $BEANS_ID"
    description: "Open task in OpenCode"
  - name: claude
    exec: claude "Work on task $BEANS_ID"
    description: "Open task in Claude Code"
  - name: tmux
    exec: ./scripts/tmux-session-run
    description: "Open task in tmux"
  - name: tmux+claude
    description: "Open task in Claude Code in a new tmux window"
    exec: |
      #!/usr/bin/env bash
      set -euo pipefail
      tmux new-window -c "${BEANS_ROOT:-.}" -n "$BEANS_ID" \
        "claude \"\$(beans show --raw $BEANS_ID)\""
  - name: worktree-tmux+claude
    multiple: true
    description: "Create git worktree and open Claude Code in a new tmux window"
    exec: |
      #!/usr/bin/env bash
      set -euo pipefail

      cd "${BEANS_ROOT:-.}"
      WORKTREE_DIR=".worktrees/$BEANS_ID"

      # Create worktree if it doesn't exist
      if [ ! -d "$WORKTREE_DIR" ]; then
        git worktree prune

        if git show-ref --verify --quiet "refs/heads/task/$BEANS_ID"; then
          git worktree add --no-checkout "$WORKTREE_DIR" "task/$BEANS_ID"
        else
          git worktree add --no-checkout "$WORKTREE_DIR" -b "task/$BEANS_ID"
        fi

        # Keep beans data in the main worktree only
        git -C "$WORKTREE_DIR" sparse-checkout set --no-cone '/*' '!/.beans' '!/.beans.yml'
        git -C "$WORKTREE_DIR" checkout
      fi

      tmux new-window -c "$PWD/$WORKTREE_DIR" -n "$BEANS_ID" \
        "claude \"\$(beans show --raw $BEANS_ID)\""
  - name: crush
    exec: crush run "Work on task $BEANS_ID"
    description: "Open task in Crush"
  - name: worktree-kitty
    multiple: true
    description: "Create git worktree and open in new kitty window"
    exec: |
      #!/usr/bin/env bash
      set -euo pipefail

      WORKTREE_DIR=".worktrees/$BEANS_ID"

      # Create worktree if it doesn't exist
      if [ ! -d "$WORKTREE_DIR" ]; then
        # Clean up any stale worktree registrations
        git worktree prune

        # Check if branch already exists
        if git show-ref --verify --quiet "refs/heads/task/$BEANS_ID"; then
          # Branch exists, check it out in the worktree
          git worktree add --no-checkout "$WORKTREE_DIR" "task/$BEANS_ID"
        else
          # Create new branch
          git worktree add --no-checkout "$WORKTREE_DIR" -b "task/$BEANS_ID"
        fi
        
        # Configure sparse checkout in the worktree
        cd "$WORKTREE_DIR"
        git sparse-checkout set --no-cone '/*' '!/.beans' '!/.beans.yml'
        git checkout
      fi

      # Open in new kitty window
      kitty @ launch --type=window --cwd="$BEANS_ROOT/$WORKTREE_DIR" \
        opencode -p "Work on task $BEANS_ID"

