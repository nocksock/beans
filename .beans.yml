beans:

    path: .beans
    prefix: beans-
    id_length: 4
    default_status: todo
    default_type: task

launchers:
  - name: worktree-tmux+claude
    multiple: true
    description: "Create git worktree and open Claude Code in a new tmux window"
    exec: |
      #!/usr/bin/env bash
      set -euo pipefail

      cd "${BEANS_ROOT:-.}"
      WORKTREE_DIR="$(./scripts/bean-worktree)"

      # Claude renames the window itself once it knows what the bean is about
      read -r -d '' RENAME_NOTE <<'EOF' || true
      ## tmux window

      You are running in a tmux window. Before starting, rename it to `<bean-id>: <label>`, where <label> is a short summary of this bean of at most 20 characters:
      `tmux rename-window -t "$TMUX_PANE" '<bean-id>: <label>'`
      EOF

      # Unquoted heredoc: paths are baked in, \$TMUX_PANE must resolve in the new window
      HUB="$(pwd)"
      read -r -d '' CLEANUP_NOTE <<EOF || true
      ## Cleanup when done

      This bean runs in the worktree $WORKTREE_DIR on branch task/$BEANS_ID. Clean up only after the user has explicitly declared the work done AND task/$BEANS_ID has been merged into dev. Never on your own initiative, and never because the bean is marked completed. If in doubt, ask.

      1. Confirm the merge: \`git -C "$HUB" merge-base --is-ancestor task/$BEANS_ID dev\` must succeed. If it fails, stop and tell the user.
      2. Mark the bean completed and commit that in the hub: \`beans update $BEANS_ID --status completed && git -C "$HUB" add .beans && git -C "$HUB" commit -m "chore: complete $BEANS_ID"\`
      3. Remove the worktree: \`git -C "$HUB" worktree remove "$WORKTREE_DIR"\`. Do not pass --force; if it refuses because of uncommitted changes, stop and tell the user.
      4. Delete the branch from the dev worktree, so -d checks it against dev: \`git -C "$HUB/dev" branch -d task/$BEANS_ID\`
      5. Close this tmux window as the very last step, since it ends this session: \`tmux kill-window -t "\$TMUX_PANE"\`
      EOF
      PROMPT="$(beans show --prompt "$BEANS_ID")"$'\n\n'"$RENAME_NOTE"$'\n\n'"$CLEANUP_NOTE"

      # Draft beans get planned before any implementation
      read -r -d '' DRAFT_NOTE <<EOF || true
      ## Draft: plan first

      This bean is still a draft. Do not implement anything yet. Plan the feature first: work out the requirements and open questions with the user, then write the agreed plan into the bean body. Once the plan is done, set the status to todo with \`beans update $BEANS_ID --status todo\` and commit the bean change in the hub.
      EOF
      if [[ "$(beans show --json "$BEANS_ID" | jq -r .status)" == draft ]]; then
        PROMPT+=$'\n\n'"$DRAFT_NOTE"
      fi

      tmux new-window -c "$WORKTREE_DIR" -n "$BEANS_ID" -e "BEANS_PROMPT=$PROMPT" \
        'claude "$BEANS_PROMPT"'
  - name: opencode
    exec: cd dev && opencode --prompt "Work on task $BEANS_ID"
    description: "Open task in OpenCode"
  - name: claude
    exec: cd dev && claude "Work on task $BEANS_ID"
    description: "Open task in Claude Code"
  - name: tmux
    exec: ./scripts/tmux-session-run
    description: "Open task in tmux"
  - name: tmux+claude
    description: "Open task in Claude Code in a new tmux window"
    exec: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Claude renames the window itself once it knows what the bean is about
      read -r -d '' RENAME_NOTE <<'EOF' || true
      ## tmux window

      You are running in a tmux window. Before starting, rename it to `<bean-id>: <label>`, where <label> is a short summary of this bean of at most 20 characters:
      `tmux rename-window -t "$TMUX_PANE" '<bean-id>: <label>'`
      EOF
      PROMPT="$(beans show --prompt "$BEANS_ID")"$'\n\n'"$RENAME_NOTE"

      # Draft beans get planned before any implementation
      read -r -d '' DRAFT_NOTE <<EOF || true
      ## Draft: plan first

      This bean is still a draft. Do not implement anything yet. Plan the feature first: work out the requirements and open questions with the user, then write the agreed plan into the bean body. Once the plan is done, set the status to todo with \`beans update $BEANS_ID --status todo\` and commit the bean change in the hub.
      EOF
      if [[ "$(beans show --json "$BEANS_ID" | jq -r .status)" == draft ]]; then
        PROMPT+=$'\n\n'"$DRAFT_NOTE"
      fi

      tmux new-window -c "${BEANS_ROOT:-.}/dev" -n "$BEANS_ID" -e "BEANS_PROMPT=$PROMPT" \
        'claude "$BEANS_PROMPT"'
  - name: crush
    exec: cd dev && crush run "Work on task $BEANS_ID"
    description: "Open task in Crush"
  - name: worktree-kitty
    multiple: true
    description: "Create git worktree and open in new kitty window"
    exec: |
      #!/usr/bin/env bash
      set -euo pipefail

      cd "${BEANS_ROOT:-.}"
      WORKTREE_DIR="$(./scripts/bean-worktree)"

      # Open in new kitty window
      kitty @ launch --type=window --cwd="$WORKTREE_DIR" \
        opencode -p "Work on task $BEANS_ID"
